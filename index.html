<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カスタムjs → ランチャー対応 変換</title>
<meta name="description" content="Dancing☆Onigiri (CW Edition) の既存のカスタムjsを、ランチャーの規格に合わせて書き換えます。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>カスタムjs → ランチャー対応 変換</h1>
    <p>Dancing☆Onigiri (CW Edition) のカスタムjsを、<a href="https://github.com/cwtickle/danoniplus-plugins" target="_blank" rel="noopener">ランチャー</a>の規格（v<span id="specVer"></span>）に合わせて書き換えます。貼った js はこのページの中だけで処理し、どこにも送りません。</p>
    <p class="sub">機械が直すのは「宣言と登録を足す」「選んだ定数を設定に変える」の 2 つです。画面の作りを変える所は、場所と直し方を案内します。</p>
</header>

<main>
    <section id="secSource">
        <h2><span class="num">1</span>元のカスタムjs</h2>
        <div class="row">
            <label class="btn">ファイルを選択<input type="file" id="file" accept=".js,text/javascript" hidden></label>
            <button type="button" id="btnSample" class="btn ghost">見本を入れる</button>
            <span id="fileNote" class="muted"></span>
        </div>
        <textarea id="source" spellcheck="false" placeholder="ここに js を貼るか、ファイルをドロップします"></textarea>
        <p id="sourceError" class="error" hidden></p>
    </section>

    <section id="secBasic" hidden>
        <h2><span class="num">2</span>基本の情報</h2>
        <div class="grid">
            <label>id<input type="text" id="fId" maxlength="40" placeholder="my-plugin"><small>英数字と . _ -。danoniplus-plugins に出すなら、フォルダ名と同じにします</small></label>
            <label>版<input type="text" id="fVersion" maxlength="20" value="1.0.0"></label>
            <label>名前（日本語）<input type="text" id="fNameJa" maxlength="80"></label>
            <label>名前（英語）<input type="text" id="fNameEn" maxlength="80"></label>
            <label class="wide">説明（日本語）<input type="text" id="fDescJa" maxlength="200" placeholder="1 行の説明"></label>
            <label class="wide">説明（英語）<input type="text" id="fDescEn" maxlength="200"></label>
        </div>
        <label class="check"><input type="checkbox" id="fAffects">判定・操作に関わる<small>一覧に印が出ます</small></label>
    </section>

    <section id="secCands" hidden>
        <h2><span class="num">3</span>設定にする定数</h2>
        <p class="muted" id="candLead"></p>
        <div id="cands"></div>
    </section>

    <section id="secNotes" hidden>
        <h2><span class="num">4</span>気を付ける所</h2>
        <ul id="notes" class="notes"></ul>
    </section>

    <section id="secResult" hidden>
        <h2><span class="num">5</span>結果</h2>
        <div class="row">
            <label class="check"><input type="checkbox" id="oLazy" checked>計算した定数を関数に直す</label>
            <label class="check"><input type="checkbox" id="oStub" checked>onChange の下書きを入れる</label>
            <label class="check"><input type="checkbox" id="oAscii">ASCII だけの形にする<small>ほかの人のサイトに読み込ませる js 向け</small></label>
        </div>
        <ul id="errors" class="notes" hidden></ul>
        <div id="resultBody">
            <div class="row">
                <div class="tabs" role="tablist">
                    <button type="button" role="tab" id="tabDiff" aria-selected="true">差分</button>
                    <button type="button" role="tab" id="tabFull" aria-selected="false">全文</button>
                </div>
                <span id="diffStat" class="muted"></span>
                <span class="spacer"></span>
                <button type="button" id="btnCopy" class="btn ghost">コピー</button>
                <button type="button" id="btnSave" class="btn">保存</button>
            </div>
            <div id="diff" class="code"></div>
            <textarea id="output" class="code" readonly hidden spellcheck="false"></textarea>
        </div>
    </section>
</main>

<footer>
    <p>変換のあとは、ランチャーと一緒に作品ページへ読み込んで、動きを確かめてください。変換ツール v<span id="toolVer"></span></p>
</footer>
<script type="module" src="src/app.js"></script>
</body>
</html>
